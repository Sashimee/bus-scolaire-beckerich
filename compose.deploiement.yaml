# Déploiement sur la VPS, monté par Dokploy — le modèle que `compose.yaml` annonçait.
#
# `compose.yaml` (à la racine) sert au développement local : il CONSTRUIT l'image et
# expose la base sur l'hôte pour `npm test`. Ce fichier-ci, lui, ne construit rien : il
# TIRE l'image que la CI a déjà construite et poussée sur GHCR, pour que ce qui tourne
# en production soit exactement ce que les tests ont validé — jamais une image bâtie une
# seconde fois sur une machine où personne ne regarde. Voir `.github/workflows/deploy.yml`.
#
# Dokploy fournit `dokploy-network` (le réseau où vit Traefik) et injecte les secrets
# depuis son interface. Les `${…}` ci-dessous sont donc renseignés côté Dokploy, pas
# dans un `.env` du dépôt : aucun secret ne doit entrer ici.
#
#   Lot 22 : le serveur RÉPOND sur app.schoulbus.lu/api.
#   Lot 23 : le site (service bus-site) vit sous la RACINE d'app.schoulbus.lu, à la même
#   origine que l'API — la bascule d'origine. Le déploiement GitHub Pages reste vivant
#   le temps de la transition (filet de repli), jusqu'à ce que le DNS bascule.

name: bus-beckerich

services:
  bus-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe de la base requis}
      POSTGRES_DB: ${POSTGRES_DB:-bus}
    volumes:
      - postgres:/var/lib/postgresql/data
    # AUCUN `ports:` : la base ne sort jamais du réseau interne. Contrairement au
    # `compose.yaml` local, rien sur la VPS n'a à joindre PostgreSQL depuis l'hôte —
    # seul `bus-api`, sur le réseau interne, lui parle.
    networks:
      - interne
    healthcheck:
      # Le serveur applique ses migrations au démarrage : s'il part avant que la base
      # accepte des connexions, la première migration échoue et le conteneur redémarre
      # en boucle. `depends_on … service_healthy` l'en empêche.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bus} -d ${POSTGRES_DB:-bus}']
      interval: 5s
      timeout: 3s
      retries: 10

  bus-api:
    # L'image poussée par la CI. Épinglée par défaut sur `:latest`, mais Dokploy peut
    # imposer un condensat précis (`@sha256:…`) pour qu'un redéploiement rejoue la même
    # image et non « la dernière en date ».
    image: ${IMAGE_SERVEUR:-ghcr.io/sashimee/bus-api:latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      BASE_API: /api
      # Le serveur et la base se voient par leurs noms de service sur le réseau interne.
      DATABASE_URL: postgres://${POSTGRES_USER:-bus}:${POSTGRES_PASSWORD:?}@bus-postgres:5432/${POSTGRES_DB:-bus}

      # Origine du site tant qu'il vit ailleurs (GitHub Pages, lot 22). Au lot 23,
      # quand le site passera sous app.schoulbus.lu, l'API et lui partageront l'origine
      # et le CORS n'aura plus d'objet — mais d'ici là, c'est CETTE valeur qui autorise
      # l'application déployée à appeler le serveur.
      ORIGINES_AUTORISEES: ${ORIGINES_AUTORISEES:?origine(s) du site requises}

      # Déclarée, et non devinée : derrière Traefik, l'URL vue par le serveur porte le
      # nom du conteneur (`http://bus-api:3000/…`). La déduire casserait le `redirect_uri`
      # d'OAuth, que GitHub et Google comparent caractère par caractère. Voir http.ts.
      URL_API_PUBLIQUE: ${URL_API_PUBLIQUE:-https://app.schoulbus.lu/api}
      # Origine du site, pour les liens des notifications de rappel.
      URL_SITE: ${URL_SITE:?}

      # Un seul relais devant nous : Traefik. Si un jour un second s'ajoute (un CDN, un
      # autre proxy), passer à 2 — sinon la limitation de débit lira l'adresse du relais
      # et la partagera entre tout le monde. Réserve R40.
      NB_PROXYS_FIABLES: ${NB_PROXYS_FIABLES:-1}

      # — Secrets, injectés par Dokploy —
      SECRET_SESSION: ${SECRET_SESSION:?}
      VAPID_JWK: ${VAPID_JWK:?}
      CONTACT_VAPID: ${CONTACT_VAPID:?}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Comptes utilisateurs (lot 24). L'espace comptes s'active avec SECRET_SESSION
      # (déjà là) ; le SMTP ci-dessous lui permet d'ENVOYER les courriels de vérification
      # et de réinitialisation. Vise le conteneur de relai courriel sur le réseau interne
      # (`bus-site` et `bus-api` ne le voient pas — le relai est joint par son nom de
      # service). Sans SMTP_HOTE, la création de compte et la réinitialisation sont
      # refusées avec un motif clair plutôt qu'échouées en silence.
      SMTP_HOTE: ${SMTP_HOTE:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_EXPEDITEUR: ${SMTP_EXPEDITEUR:-}
      # Facultatifs : un relai interne n'exige en général ni TLS ni identifiant.
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOTDEPASSE: ${SMTP_MOTDEPASSE:-}
      # Publication vers le dépôt, conservée à l'identique jusqu'au lot 24 (où la
      # publication cessera de passer par GitHub). Le jeton machine, fine-grained,
      # Contents: RW sur ce seul dépôt.
      GITHUB_PAT: ${GITHUB_PAT:?}
    depends_on:
      bus-postgres:
        condition: service_healthy
    networks:
      - interne
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # app.schoulbus.lu/api → ce conteneur ; tout le reste du domaine → le site
      # (service bus-site ci-dessous). Le `/api` n'est PAS retiré du chemin : le serveur
      # monte toutes ses routes sous `BASE_API=/api` et l'attend. La `priority` élevée
      # garantit que cette règle l'emporte sur celle du site, qui capte la racine : sans
      # elle, Traefik les départage par longueur de règle, ce qui tomberait juste ici
      # mais qu'on ne veut pas laisser au hasard sur un chemin aussi sensible.
      - traefik.http.routers.bus-api.rule=Host(`app.schoulbus.lu`) && PathPrefix(`/api`)
      - traefik.http.routers.bus-api.priority=100
      - traefik.http.routers.bus-api.entrypoints=websecure
      - traefik.http.routers.bus-api.tls.certresolver=letsencrypt
      - traefik.http.services.bus-api.loadbalancer.server.port=3000

  bus-site:
    # Le site construit (lot 23), servi par Caddy sous la RACINE d'app.schoulbus.lu, à
    # la même origine que l'API. C'est la bascule d'origine : le CORS n'a plus d'objet,
    # et la CSP se resserre. L'image est construite et poussée par la CI, comme bus-api ;
    # l'origine et le chemin de base y sont figés au build (voir Dockerfile.site).
    image: ${IMAGE_SITE:-ghcr.io/sashimee/bus-site:latest}
    restart: unless-stopped
    # Le site est purement statique : il ne touche ni la base ni aucun secret. Il ne
    # tient donc que sur le réseau de Traefik.
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # La racine du domaine, tout ce que `/api` ne capte pas. Priority basse : l'API
      # passe devant.
      - traefik.http.routers.bus-site.rule=Host(`app.schoulbus.lu`)
      - traefik.http.routers.bus-site.priority=1
      - traefik.http.routers.bus-site.entrypoints=websecure
      - traefik.http.routers.bus-site.tls.certresolver=letsencrypt
      - traefik.http.services.bus-site.loadbalancer.server.port=8080

networks:
  # Réseau privé serveur↔base, invisible de Traefik : la base n'y est jamais exposée.
  interne:
  # Fourni par Dokploy ; c'est là que Traefik cherche les routeurs.
  dokploy-network:
    external: true

volumes:
  postgres:

name = "bus-beckerich"
main = "src/index.js"
compatibility_date = "2024-11-01"
# `global_fetch_strictly_public` : sans lui, la sous-requête de `/notifier` vers
# `/notifier-lot` est refusée par Cloudflare avec « error code: 1042 » — un Worker n'a
# pas le droit d'appeler un Worker de la même zone. Le drapeau fait ressortir l'appel
# par la porte d'entrée publique, ce qui le fait revenir comme une invocation neuve,
# avec son propre budget processeur : exactement ce que le découpage en lots cherche.
# `wrangler dev` en local autorise cet appel, lui : la panne ne se voit qu'en production.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Stockage des abonnements push et des états OAuth temporaires.
# Créer l'espace avant le premier déploiement :
#   npx wrangler kv namespace create ABONNEMENTS
# puis reporter l'identifiant renvoyé ci-dessous.
[[kv_namespaces]]
binding = "ABONNEMENTS"
id = "d53d925456534d2491d7632af5ca0c55"

[vars]
# Seules ces origines peuvent recevoir un jeton OAuth en retour.
# Sans cette liste, le Worker serait une redirection ouverte.
ORIGINES_AUTORISEES = "https://sashimee.github.io,http://localhost:5173"
# Contact exigé par la spécification VAPID, transmis aux services de push en cas de
# problème. À renseigner avant le déploiement — de préférence une adresse dédiée
# plutôt qu'une adresse personnelle, ce fichier étant dans un dépôt public.
CONTACT_VAPID = "mailto:alex.baskewitsch@gmail.com"
# Nombre d'abonnés traités par invocation. Le plan gratuit n'accorde que 10 ms de
# processeur, et chaque push coûte un chiffrement plus une signature. 10 est une
# estimation prudente, NON MESURÉE : à ajuster après un premier envoi réel en
# regardant `npx wrangler tail`. Voir ADMIN.md.
TAILLE_LOT = "10"

# Dépôt visé par les publications de l'espace commune. En variable plutôt qu'en
# constante compilée : le même Worker peut ainsi viser un dépôt de test.
DEPOT_PROPRIETAIRE = "Sashimee"
DEPOT_NOM = "bus-scolaire-beckerich"
DEPOT_BRANCHE = "main"

# Secrets à définir séparément, jamais dans ce fichier :
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put VAPID_JWK
#   npx wrangler secret put SECRET_NOTIFICATION

# Espace commune. Sans SECRET_SESSION, les routes /commune/* répondent 503 et le
# reste du Worker fonctionne normalement.
#   npx wrangler secret put GITHUB_PAT      # jeton *fine-grained*, contenu en
#                                           # écriture, CE dépôt uniquement
#   npx wrangler secret put SECRET_SESSION  # clé de signature des jetons de session

name = "bus-beckerich"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Stockage des abonnements push et des états OAuth temporaires.
# Créer l'espace avant le premier déploiement :
#   npx wrangler kv namespace create ABONNEMENTS
# puis reporter l'identifiant renvoyé ci-dessous.
[[kv_namespaces]]
binding = "ABONNEMENTS"
id = "à-remplacer-après-création"

[vars]
# Seules ces origines peuvent recevoir un jeton OAuth en retour.
# Sans cette liste, le Worker serait une redirection ouverte.
ORIGINES_AUTORISEES = "https://sashimee.github.io,http://localhost:5173"
# Contact exigé par la spécification VAPID, transmis aux services de push en cas de
# problème. À renseigner avant le déploiement — de préférence une adresse dédiée
# plutôt qu'une adresse personnelle, ce fichier étant dans un dépôt public.
CONTACT_VAPID = "mailto:contact@example.org"
# Nombre d'abonnés traités par invocation. Le plan gratuit n'accorde que 10 ms de
# processeur, et chaque push coûte un chiffrement plus une signature. 10 est une
# estimation prudente, NON MESURÉE : à ajuster après un premier envoi réel en
# regardant `npx wrangler tail`. Voir ADMIN.md.
TAILLE_LOT = "10"

# Secrets à définir séparément, jamais dans ce fichier :
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put VAPID_JWK
#   npx wrangler secret put SECRET_NOTIFICATION

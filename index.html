<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bus scolaire Beckerich</title>
    <meta
      name="description"
      content="Les horaires du bus scolaire de la commune de Beckerich, personnalisés pour chaque enfant. Site indépendant, sans lien avec la commune."
    />
    <!--
      La couleur de barre suit le thème : sombre par défaut, clair si le système l'est.
      Les deux valeurs sont `--fond` dans chacun des deux thèmes de la couche `tokens`,
      recopiées à la main — une balise `<meta>` ne sait pas lire une variable CSS.
      `src/style.test.ts` vérifie qu'elles n'ont pas divergé.
    -->
    <meta name="theme-color" content="#121a19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bus scolaire" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icones/icone-192.png" />
    <!-- Le site n'est pas destiné à concurrencer la page officielle de la commune. -->
    <meta name="robots" content="noindex" />
    <!--
      Le compteur de visites n'est plus un script tiers : il est auto-hébergé (lots 27-28).
      Un seul relevé part à l'ouverture vers notre propre serveur, depuis `src/lib/mesure.ts`
      — aucune origine externe, donc rien à ouvrir dans la CSP au-delà de `'self'` et de l'API.
    -->
</head>
  <body>
    <div id="root"></div>
    <noscript>
      Cette application nécessite JavaScript. Le plan officiel reste consultable sur
      <a href="https://kanner.beckerich.lu/infos/horaires-de-bus">kanner.beckerich.lu</a>.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

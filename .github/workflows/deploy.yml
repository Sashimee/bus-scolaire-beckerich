name: Déploiement — site et image du serveur

# Chaque push sur main fait, en parallèle :
#  - met à jour le site sur GitHub Pages ET la webapp installée chez les parents (le
#    service worker détecte la nouvelle version et propose le rechargement) — filet de
#    repli le temps de la transition vers app.schoulbus.lu ;
#  - construit et pousse DEUX images sur GHCR, que Dokploy tire ensuite sur la VPS :
#    `bus-api` (le serveur) et `bus-site` (le site sous app.schoulbus.lu, lot 23).
#    Ainsi ce qui tourne en production est CE que les tests ont validé, jamais une
#    seconde construction faite ailleurs. Voir `compose.deploiement.yaml`.
#
# Depuis le lot 29, la branche `dev` a sa PROPRE pile sur la même VPS
# (dev.schoulbus.lu). Elle passe par le même travail, avec trois différences, toutes
# gardées ci-dessous : elle ne déploie PAS GitHub Pages (un dépôt n'a qu'un site), elle
# n'écrit JAMAIS l'étiquette `latest` (c'est celle que la production tire), et son image
# de site est construite sur son propre domaine — Vite fige l'origine dans le bundle,
# une image de dev bâtie sur les valeurs de prod appellerait la base de production.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# On laisse toujours finir un déploiement en cours plutôt que de l'annuler : une
# interruption laisserait le site dans un état intermédiaire. Le groupe porte la
# référence : sans elle, un push sur `dev` attendrait la fin d'un déploiement de
# production, et inversement — deux piles indépendantes qui se mettent en file.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    name: Tests et vérification des types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Une faille connue dans une dépendance ne doit pas partir en production sans que
      # personne l'ait vue. `high` et non `moderate` : au-dessous, le bruit ferait
      # ignorer l'étape, ce qui reviendrait à ne pas l'avoir.
      - name: Vulnérabilités connues des dépendances
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test

  serveur:
    name: Tests du serveur
    runs-on: ubuntu-latest
    services:
      # Un vrai PostgreSQL, et non un simulacre : les tests de stockage vérifient
      # `on conflict … returning` sous concurrence, `make_interval` et le typage
      # `jsonb`. Un faux les ferait passer sans rien prouver — or c'est précisément
      # cette requête-là qui rend stricte la limitation de débit (réserve R4).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bus
          POSTGRES_PASSWORD: bus
          POSTGRES_DB: bus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bus -d bus"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serveur/package-lock.json
      - run: npm ci
        working-directory: serveur
      - name: Vulnérabilités connues des dépendances
        run: npm audit --audit-level=high
        working-directory: serveur
      - run: npm run typecheck
        working-directory: serveur
      - run: npm test
        working-directory: serveur
        env:
          DATABASE_URL_TEST: postgres://bus:bus@localhost:5433/bus
      # Le paquet doit se construire : une erreur d'empaquetage ne se voit ni au
      # typage ni aux tests, et n'apparaîtrait qu'à la construction de l'image.
      - run: npm run build
        working-directory: serveur

  construction:
    name: Construction du site (GitHub Pages)
    needs: controle
    # Pages n'a qu'un déploiement par dépôt : seule la branche par défaut y va. La pile
    # `dev` se regarde sur dev.schoulbus.lu, pas sur Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire
        run: npm run build
        env:
          # Chemin de base du site projet. À changer ici — et nulle part ailleurs — si
          # le site déménage sous un autre préfixe ou un domaine propre.
          BASE_PATH: /${{ github.event.repository.name }}/
          GITHUB_SHA: ${{ github.sha }}
          # Notifications et connexion GitHub. Variables de dépôt, pas des secrets :
          # ces deux valeurs sont publiques par nature (l'URL du Worker et la clé
          # publique VAPID se retrouvent de toute façon dans le code servi).
          # Vides, l'application fonctionne à l'identique, sans ces fonctionnalités.
          # Deux noms le temps de la bascule : `URL_API` est le nouveau, `URL_WORKER`
          # l'ancien. `src/config.ts` lit le premier qui n'est pas vide, si bien qu'une
          # construction faite avant ou après le renommage de la variable de dépôt
          # produit la même application.
          VITE_URL_API: ${{ vars.URL_API }}
          VITE_URL_WORKER: ${{ vars.URL_WORKER }}
          VITE_CLE_VAPID: ${{ vars.CLE_VAPID }}
          # Vide, l'intégration Google Agenda disparaît de l'interface et l'export .ics
          # reste seul — c'est le comportement voulu tant qu'aucun ID client n'existe.
          VITE_ID_CLIENT_GOOGLE: ${{ vars.ID_CLIENT_GOOGLE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploiement:
    name: Mise en ligne (GitHub Pages)
    needs: construction
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  image-serveur:
    name: Image du serveur (GHCR)
    # Gardée par les tests du serveur : une image ne part JAMAIS sans que les 109 cas
    # soient passés contre un vrai PostgreSQL. C'est tout l'intérêt de la construire
    # ici plutôt que de laisser Dokploy la bâtir depuis les sources, sans garde-fou.
    needs: serveur
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bus-api
          # `latest` pour le suivi courant, et le condensat du commit pour épingler un
          # redéploiement à une version précise depuis Dokploy (`…@sha256:` ou le tag
          # `sha-…`). Voir `IMAGE_SERVEUR` dans compose.deploiement.yaml.
          # `latest` UNIQUEMENT sur la branche par défaut : c'est l'étiquette que tire
          # la production. Un push sur `dev` qui l'écraserait mettrait la refonte en
          # ligne chez les parents au prochain redéploiement, sans que personne l'ait
          # demandé. `type=ref,event=branch` donne `:main` et `:dev` ; le condensat du
          # commit reste là pour épingler une version précise depuis Dokploy.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          # Le contexte est la RACINE : le serveur importe `src/lib/*.ts`. Voir le
          # Dockerfile, qui porte le même avertissement.
          context: .
          file: serveur/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-site:
    name: Image du site (GHCR)
    # Gardée par les tests de l'application, comme l'image du serveur l'est par les
    # siens. C'est l'image qui sert app.schoulbus.lu (lot 23) ; le déploiement Pages
    # ci-dessus reste vivant en parallèle, le temps de la transition.
    needs: controle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      #
      # Quelle pile cette image sert-elle ? La question se pose une fois, ici, et non
      # trois fois dans les `build-args` : l'idiome ternaire de GitHub (`A && B || C`)
      # retombe sur `C` dès que `B` est VIDE, si bien qu'une variable de dépôt non
      # renseignée sur `main` y aurait silencieusement chargé la valeur de `dev`. Une
      # clé VAPID de dev servie en production ne casse rien à l'ouverture : elle rend
      # seulement les notifications inopérantes, des semaines plus tard.
      - name: Identité de la pile visée
        id: pile
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            {
              echo "url_publique=${{ vars.URL_PUBLIQUE || 'https://app.schoulbus.lu' }}"
              echo "url_api=${{ vars.URL_API || 'https://app.schoulbus.lu/api' }}"
              echo "cle_vapid=${{ vars.CLE_VAPID }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "url_publique=https://dev.schoulbus.lu"
              echo "url_api=https://dev.schoulbus.lu/api"
              echo "cle_vapid=${{ vars.CLE_VAPID_DEV }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bus-site
          # `latest` UNIQUEMENT sur la branche par défaut : c'est l'étiquette que tire
          # la production. Un push sur `dev` qui l'écraserait mettrait la refonte en
          # ligne chez les parents au prochain redéploiement, sans que personne l'ait
          # demandé. `type=ref,event=branch` donne `:main` et `:dev` ; le condensat du
          # commit reste là pour épingler une version précise depuis Dokploy.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.site
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # L'origine et le chemin de base sont FIGÉS dans l'image, Vite les inlinant au
          # build. Cette image est celle d'app.schoulbus.lu, à la racine — d'où
          # `BASE_PATH=/`, distinct du `/bus-scolaire-beckerich/` du build Pages. Les
          # clés publiques viennent des variables de dépôt, comme pour Pages.
          #
          # L'origine, le chemin de base et la clé publique VAPID sont INLINÉS par Vite
          # dans le bundle : ils font partie de l'image et ne se corrigent pas au
          # déploiement. Se tromper ici ne casse rien de visible — le site de dev
          # s'ouvre, et c'est la base de PRODUCTION qu'il écrit.
          build-args: |
            BASE_PATH=/
            URL_PUBLIQUE=${{ steps.pile.outputs.url_publique }}
            VITE_URL_API=${{ steps.pile.outputs.url_api }}
            VITE_CLE_VAPID=${{ steps.pile.outputs.cle_vapid }}
            VITE_ID_CLIENT_GOOGLE=${{ vars.ID_CLIENT_GOOGLE }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

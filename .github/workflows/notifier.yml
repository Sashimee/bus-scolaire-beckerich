name: Notifier les perturbations

# Se déclenche uniquement quand le fichier des urgences change. Une modification du
# code ou des horaires de référence ne doit réveiller le téléphone de personne.
on:
  push:
    branches: [main]
    paths:
      - 'public/urgences.json'

jobs:
  notifier:
    runs-on: ubuntu-latest
    # Sans Worker configuré, l'étape est simplement sautée : le site continue de
    # fonctionner avec le seul bandeau d'alerte dans l'application.
    if: vars.URL_WORKER != ''
    steps:
      - uses: actions/checkout@v4
        with:
          # Deux commits pour pouvoir comparer avec l'état précédent.
          fetch-depth: 2

      - name: Repérer les perturbations nouvellement publiées
        id: nouvelles
        run: |
          git show HEAD~1:public/urgences.json > /tmp/avant.json 2>/dev/null || echo '{"perturbations":[]}' > /tmp/avant.json
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'

          const lire = (c) => { try { return JSON.parse(readFileSync(c, 'utf8')).perturbations ?? [] } catch { return [] } }
          const avant = new Set(lire('/tmp/avant.json').map((p) => p.id))
          const apres = lire('public/urgences.json')
          const nouvelles = apres.filter((p) => !avant.has(p.id))

          // On ne notifie que les ajouts. Un retrait de perturbation ne justifie pas
          // de réveiller tout le monde une seconde fois.
          if (!nouvelles.length) {
            console.log('aucune=true')
          } else {
            const p = nouvelles[0]
            const titres = {
              annulation: 'Bus annulé',
              retard: 'Bus en retard',
              'arret-deplace': 'Arrêt déplacé',
              message: 'Information bus scolaire',
            }
            const charge = {
              id: p.id,
              titre: titres[p.type] ?? 'Bus scolaire Beckerich',
              corps: p.message.fr,
              gravite: p.gravite,
              url: './',
            }
            console.log('aucune=false')
            console.log(`charge=${JSON.stringify(charge)}`)
          }
          EOF

      - name: Envoyer la notification
        if: steps.nouvelles.outputs.aucune == 'false'
        run: |
          reponse=$(curl -sS -w '\n%{http_code}' -X POST "${{ vars.URL_WORKER }}/notifier" \
            -H "Authorization: Bearer ${{ secrets.SECRET_NOTIFICATION }}" \\
            -H 'Content-Type: application/json' \
            -d '${{ steps.nouvelles.outputs.charge }}')
          corps=$(echo "$reponse" | head -n -1)
          code=$(echo "$reponse" | tail -n1)
          echo "Worker a répondu $code : $corps"
          # Un échec d'envoi ne doit pas faire échouer le déploiement du site :
          # le bandeau dans l'application reste, lui, bien publié.
          if [ "$code" != "200" ]; then
            echo "::warning::L'envoi des notifications a échoué (HTTP $code). Le bandeau dans l'application reste actif."
          fi
